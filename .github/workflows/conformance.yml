name: Conformance Suite

on:
  push:
    branches: [main]
  # No base-branch filter. It used to be `branches: [main]`, which silently gave ZERO checks to
  # any stacked PR — a PR targeting another PR's branch got a green tick with nothing behind it.
  # This suite exists because work was built, never landed, and never checked; a CI trigger that
  # quietly declines to run on half the PRs is the same failure wearing a green badge.
  pull_request:

jobs:
  validate:
    name: Schema validation and named-rule assertions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against tracked private material
        run: |
          tracked_private="$(git ls-files private/)"
          if [ -n "$tracked_private" ]; then
            echo "ERROR: internal-only material is tracked under private/ in this PUBLIC repo:" >&2
            echo "$tracked_private" >&2
            echo "private/ is gitignored and must never be committed here. Remove it (e.g. git rm -r --cached private/)." >&2
            exit 1
          fi
          echo "OK: no tracked files under private/."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Install governance validators
        run: |
          git clone --depth 1 https://gitlab.com/cinderlit/mind-over-meta.git /tmp/mind-over-meta-parent || true
          if [ -d /tmp/mind-over-meta-parent/packages/governance-validators ]; then
            pip install -e /tmp/mind-over-meta-parent/packages/governance-validators
            cinderlit-agent-health --repo .
            cinderlit-policy-lint policy.yaml
            cinderlit-brand-lint brand-style.json
          fi

      - name: Run conformance suite
        run: pytest tests/ -v --tb=short

      # index.json and REGISTRY.md are generated artifacts that look hand-maintainable.
      # This fails when someone has edited them directly, which is how a registry ends up
      # disagreeing with the claim files sitting next to it.
      - name: Registry artifacts are generated, not hand-edited
        run: python conformance/tools/generate_registry.py --check

      - name: Evaluate every registered claim
        run: python conformance/tools/evaluate_claim.py --registry

      # NOT run here: generate_registry.py --verify-sources. It re-reads each claim's source and
      # fails on divergence OR on a source it cannot reach — and some sources are private
      # repositories that this public runner has no credentials for. Running it here would fail
      # every build for a reason unrelated to the change under test. It belongs on a runner that
      # can see the sources. Named rather than silently omitted so the gap is visible.
